# One episode = one video (exported as 16:9 and 9:16).
# Films are listed from the lowest rank to #1, the order they appear in the video.

slug: war_too_real

hook:
  overline: "War Movies That Feel"     # small gold line
  headline: "TOO REAL"                  # big white line
  left:  ["FOUR FILMS", "RANKED BY INTENSITY"]
  right: ["INSPIRED BY", "REAL BATTLES"]
  vo: "These four war movies feel so real, they're hard to watch. And number one will wreck you."

films:
  - rank: 4
    title: "13 Hours"
    year: 2016
    fact: ["TRUE STORY", "BENGHAZI, 2012"]        # optional; otherwise filled from Oscar info
    vo: "Number four. Thirteen Hours. Benghazi, 2012. Six private contractors, one compound, and no backup coming. Michael Bay drops the spectacle for pure survival, and the night feels like it never ends."

  - rank: 3
    title: "The Outpost"
    year: 2020
    fact: ["TRUE STORY", "BATTLE OF KAMDESH, 2009"]
    vo: "Number three. The Outpost. Fifty-three Americans at the bottom of a valley, surrounded by hundreds of Taliban fighters on the high ground. The battle plays out almost in real time, and it never lets you breathe."

  - rank: 2
    title: "Black Hawk Down"
    year: 2001
    vo: "Number two. Black Hawk Down. Mogadishu, 1993. A raid that should have taken one hour turns into an all-night fight to survive. No speeches. No glory. Just soldiers trying to get everyone home."

  - rank: 1
    title: "Saving Private Ryan"
    year: 1998
    vo: "And number one. Saving Private Ryan. The Omaha Beach opening changed war movies forever. Eight men risk everything to bring one soldier home, and it leaves you asking if it was worth the cost."

outro:
  question: ["Which One", "HIT YOU HARDEST?"]
  vo: "Which one hit you the hardest? Tell me in the comments, and follow for more."
