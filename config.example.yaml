# Copy this file to config.yaml and fill in your keys.
# config.yaml is in .gitignore, so your keys never get uploaded.

tmdb_token: ""        # TMDB "API Read Access Token" (the long one). Required.
omdb_key: ""          # OMDb key, for IMDb rating + Oscar info. Recommended.
deepseek_key: ""      # DeepSeek key: splits free-form scripts and picks original-audio moments.

originals:            # short moments of real movie dialogue between narration sentences
  auto: true          # let DeepSeek pick them when the script has no [ORIGINAL: ...] markers
  per_film: 1         # 0 = never
  cold_open: true     # open the video with one line of movie dialogue before the title

semantic_shots: true  # match montage shots to what the narration says (needs: pip install sentence-transformers)

voice:
  engine: elevenlabs  # elevenlabs (natural, paid) | kokoro (free, offline, a bit robotic)
  elevenlabs_key: ""
  elevenlabs_voice_id: "nPczCjzI2devNBz1zQrb"   # "Brian": deep US narrator. Swap for any voice ID from your ElevenLabs Voices page.
  elevenlabs_model: eleven_multilingual_v2      # best quality; eleven_turbo_v2_5 is cheaper
  stability: 0.45     # lower = more expressive, higher = steadier
  style: 0.25         # 0-1, how dramatic the delivery is
  kokoro_voice: am_michael
  kokoro_speed: 1.08

brand:
  name: REELRANK                   # change per account, e.g. FRIGHTRANK
  year: 2026                       # shown in the "Official Selection" laurel

music: ""                          # optional path to a royalty-free track (mp3/wav); ducked under the voice

output_dir: output
cache_dir: cache
